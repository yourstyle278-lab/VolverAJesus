            inicializar() {
                const perfilesGuardados = localStorage.getItem('senda_antigua_perfiles');
                const activoGuardado = localStorage.getItem('senda_antigua_perfil_activo');

                if (perfilesGuardados) {
                    try {
                        this.perfiles = JSON.parse(perfilesGuardados);
                        this.perfilActivo = activoGuardado || '';
                    } catch (e) {
                        this.crearPerfilPorDefecto();
                    }
                }

                if (this.perfilActivo && !this.perfiles[this.perfilActivo]) {
                    this.perfilActivo = '';
                }

                this.configurarDOMGlobal();
                this.actualizarSelectorUI();
                this.irAPantallaEntradaBienvenida();
            },

            crearPerfilPorDefecto() {
                this.perfiles = {};
                this.perfilActivo = '';
                this.guardarTodo();
            },

            guardarTodo() {
                localStorage.setItem('senda_antigua_perfiles', JSON.stringify(this.perfiles));
                localStorage.setItem('senda_antigua_perfil_activo', this.perfilActivo);
            },

            limpiarHilosYConsola() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });

                const viewport = document.getElementById('app-viewport');
                if (viewport) {
                    viewport.className = "w-full max-w-xl bg-white rounded-[2.5rem] p-6 md:p-10 shadow-sm border border-stone-100/80 relative";
                }
            },

            clickEnLogo() {
                if (this.datos && this.datos.faseActual === 'sendero_dashboard') {
                    this.irAFase('sendero_dashboard');
                } else if (Object.keys(this.perfiles).length > 0) {
                    this.irAPantallaEntradaBienvenida();
                } else {
                    this.irAFaseCreacionPerfil();
                }
            },

            irAPantallaEntradaBienvenida() {
                this.limpiarHilosYConsola();
                this.perfilActivo = '';
                this.datos = {};
                this.guardarTodo();
                this.actualizarSelectorUI();

                const progHeader = document.getElementById('progreso-header');
                if (progHeader) progHeader.innerText = "La Senda Antigua";

                const viewport = document.getElementById('app-viewport');
                if (viewport) viewport.innerHTML = VistaEntradaBienvenidaNeutral();
            },

            cargarPerfil(nombre) {
                if (!nombre || nombre.trim() === "") return;

                if (this.perfilActivo) {
                    this.guardar();
                }

                this.limpiarHilosYConsola();

                this.perfilActivo = nombre;
                if (!this.perfiles[nombre]) {
                    this.perfiles[nombre] = obtenerPerfilBase(nombre);
                }
                this.datos = this.perfiles[nombre];

                // Saneamiento defensivo: perfiles creados en versiones previas de la app
                // pueden carecer de campos añadidos después. Nunca deben quedar undefined.
                if (this.datos.indicePregunta === undefined) this.datos.indicePregunta = 0;
                if (!this.datos.respuestasTest) this.datos.respuestasTest = {};
                if (this.datos.diaActual === undefined) this.datos.diaActual = 1;
                if (!this.datos.sintomasCriticos) this.datos.sintomasCriticos = [];
                if (!this.datos.sintomasCicloAnterior) this.datos.sintomasCicloAnterior = [];
                if (!this.datos.victorias) this.datos.victorias = [];
                if (!this.datos.conteoCronicidad) this.datos.conteoCronicidad = {};
                if (!this.datos.historicoFisiologico) this.datos.historicoFisiologico = { deshidratado: false, insomnio: false, pantallas: false };
                if (!this.datos.obrasSeleccionadas) this.datos.obrasSeleccionadas = [];
                if (!this.datos.registroDias) this.datos.registroDias = { 1: null, 2: null, 3: null, 4: null, 5: null, 6: null, 7: null, 8: null, 9: null, 10: null, 11: null, 12: null, 13: null, 14: null };
                if (!this.datos.registroGratitud) this.datos.registroGratitud = {};
                if (this.datos.testimonioEstacion === undefined) this.datos.testimonioEstacion = '';
                if (!this.datos.progresoDiscipulado) this.datos.progresoDiscipulado = {};
                if (this.datos.temaActivoId === undefined) this.datos.temaActivoId = null;
                if (this.datos.entregaActivaId === undefined) this.datos.entregaActivaId = null;
                if (this.datos.pinHash === undefined) this.datos.pinHash = null;
                if (!this.datos.respuestasEncuentro) this.datos.respuestasEncuentro = {};
                if (this.datos.nivelActivoEncuentroId === undefined) this.datos.nivelActivoEncuentroId = null;
                if (this.datos.nivelMaxEncuentro === undefined) this.datos.nivelMaxEncuentro = 1;
                if (!this.datos.decisionesLectura) this.datos.decisionesLectura = {};
                if (this.datos.bienvenidaGuiadaVista === undefined) this.datos.bienvenidaGuiadaVista = false;
                if (this.datos.sugerenciaEncuentroMostrada === undefined) this.datos.sugerenciaEncuentroMostrada = false;
                if (!this.datos.respuestasGracia) this.datos.respuestasGracia = {};
                if (this.datos.moduloActivoGraciaId === undefined) this.datos.moduloActivoGraciaId = null;
                if (this.datos.moduloMaxGracia === undefined) this.datos.moduloMaxGracia = 1;

                // Corrección de bug: faseAntesDeDiscipulado es una variable compartida
                // (no pertenece a ningún perfil). Si no se limpia aquí, cambiar de
                // perfil mientras se navega el módulo de discipulados puede filtrar
                // la fase de OTRO perfil hacia este — llevándolo a un destino
                // incorrecto (ej. un perfil nuevo terminando en el dashboard vacío).
                faseAntesDeDiscipulado = null;
                faseAntesDeEncuentro = null; // mismo motivo, mismo bug potencial
                faseAntesDeBienvenidaGuiada = null;
                faseAntesDeEspacios = null;
                faseAntesDeGracia = null;
                slideBienvenidaGuiada = 0;

                this.guardarTodo();
                this.actualizarSelectorUI();
                this.renderizarFaseActual();
            },

            guardar() {
                if (this.perfilActivo) {
                    this.perfiles[this.perfilActivo] = this.datos;
                    this.guardarTodo();
                }
            },

            irAFaseCreacionPerfil() {
                this.limpiarHilosYConsola();
                const viewport = document.getElementById('app-viewport');
                const progHeader = document.getElementById('progreso-header');
                if (progHeader) progHeader.innerText = "Nuevo Comienzo";
                if (viewport) viewport.innerHTML = VistaCrearPerfilInicial();
            },

            irAFase(nuevaFase) {
                this.limpiarHilosYConsola();
                if ('speechSynthesis' in window) window.speechSynthesis.cancel(); // corta cualquier lectura en curso al navegar

                const viewport = document.getElementById('app-viewport');
                if (viewport) {
                    viewport.classList.remove('fade-in');
                    void viewport.offsetWidth;
                    viewport.classList.add('fade-in');
                }

                this.datos.faseActual = nuevaFase;
                this.guardar();
                this.renderizarFaseActual();
            },

            reiniciarCamino() {
                if (confirm(`¿Deseas reiniciar la estación? Se guardará tu historial de progreso y victorias en Cristo.`)) {
                    this.limpiarHilosYConsola();
                    const historico = this.datos.tipoRuta;
                    const victoriasPrevias = this.datos.victorias || [];
                    const sintomasPasados = this.datos.sintomasCriticos || [];
                    const cronicidadPrevia = this.datos.conteoCronicidad || {};
                    const pinHashPrevio = this.datos.pinHash || null;
                    const sugerenciaEncuentroPrevia = this.datos.sugerenciaEncuentroMostrada || false;

                    this.perfiles[this.perfilActivo] = obtenerPerfilBase(this.perfilActivo);
                    this.perfiles[this.perfilActivo].historicoRuta = historico;
                    this.perfiles[this.perfilActivo].victorias = victoriasPrevias;
                    this.perfiles[this.perfilActivo].sintomasCicloAnterior = sintomasPasados;
                    this.perfiles[this.perfilActivo].conteoCronicidad = cronicidadPrevia;
                    this.perfiles[this.perfilActivo].pinHash = pinHashPrevio;
                    this.perfiles[this.perfilActivo].sugerenciaEncuentroMostrada = sugerenciaEncuentroPrevia;

                    this.datos = this.perfiles[this.perfilActivo];
                    this.guardar();
                    this.renderizarFaseActual();
                }
            },

            configurarDOMGlobal() {
                const logo = document.getElementById('logo-senda');
                if (logo) {
                    logo.onclick = (e) => {
                        e.preventDefault();
                        this.clickEnLogo();
                    };
                }

                const selector = document.getElementById('selector-perfiles');
                if (selector) {
                    selector.onchange = (e) => {
                        if (e.target.value === "") {
                            this.irAPantallaEntradaBienvenida();
                        } else {
                            solicitarAccesoPerfil(e.target.value);
                        }
                    };
                }

                const btnNuevo = document.getElementById('btn-nuevo-perfil');
                if (btnNuevo) {
                    btnNuevo.onclick = () => {
                        const nombre = prompt("Ingresa el nombre de pila para este perfil familiar (ej. Mateo):");
                        if (nombre && nombre.trim() !== "") {
                            const limpio = textClean(nombre);
                            if (this.perfiles[limpio]) {
                                alert("Ya existe un espacio con ese nombre.");
                                return;
                            }
                            this.perfiles[limpio] = obtenerPerfilBase(limpio);
                            this.guardarTodo();
                            solicitarAccesoPerfil(limpio);
                        }
                    };
                }

                const btnCambiarPin = document.getElementById('btn-cambiar-pin');
                if (btnCambiarPin) {
                    btnCambiarPin.onclick = () => {
                        if (this.perfilActivo) cambiarPin(this.perfilActivo);
                    };
                }

                const btnCerrarSesion = document.getElementById('btn-cerrar-sesion');
                if (btnCerrarSesion) {
                    btnCerrarSesion.onclick = () => {
                        this.irAPantallaEntradaBienvenida();
                    };
                }
            },

            actualizarSelectorUI() {
                const selector = document.getElementById('selector-perfiles');
                const btnCambiarPin = document.getElementById('btn-cambiar-pin');
                const btnCerrarSesion = document.getElementById('btn-cerrar-sesion');
                const hayPerfilActivo = !!this.perfilActivo;
                if (btnCambiarPin) btnCambiarPin.classList.toggle('hidden', !hayPerfilActivo);
                if (btnCerrarSesion) btnCerrarSesion.classList.toggle('hidden', !hayPerfilActivo);

                if (!selector) return;

                if (Object.keys(this.perfiles).length === 0) {
                    selector.innerHTML = `<option value="">Sin perfiles</option>`;
                    return;
                }

                const opciones = Object.keys(this.perfiles).map(p => `
                    <option value="${p}" ${p === this.perfilActivo ? 'selected' : ''}>${p}</option>
                `).join('');

                selector.innerHTML = `<option value="" ${this.perfilActivo === '' ? 'selected' : ''}>-- Seleccionar perfil --</option>` + opciones;
            },

            renderizarFaseActual() {
                const viewport = document.getElementById('app-viewport');
                const progHeader = document.getElementById('progreso-header');

                if (!viewport) return;

                if (!this.perfilActivo) {
                    this.irAPantallaEntradaBienvenida();
                    return;
                }

                if (!this.datos.faseActual) {
                    this.datos.faseActual = 'bienvenida';
                }

                if (progHeader) {
                    switch (this.datos.faseActual) {
                        case 'bienvenida_guiada': progHeader.innerText = "Bienvenida"; break;
                        case 'bienvenida': progHeader.innerText = "El Llamado"; break;
                        case 'filtro_templo': progHeader.innerText = "Mantenimiento del Templo"; break;
                        case 'amad_test': progHeader.innerText = "Fase 1: Detenerse"; break;
                        case 'tormenta_pastoral': progHeader.innerText = "La Mirada del Pastor"; break;
                        case 'resync_timer': progHeader.innerText = "Fase 1: Silencio"; break;
                        case 'raah_confesion': progHeader.innerText = "Fase 2: Volver en sí"; break;
                        case 'netibot_gracia': progHeader.innerText = "Fase 3: Preguntar"; break;
                        case 'halak_obras': progHeader.innerText = "Fase 4: El Caminar"; break;
                        case 'sendero_dashboard': progHeader.innerText = `Día ${this.datos.diaActual} — Estación`; break;
                        case 'checkpoint_evaluacion': progHeader.innerText = (this.datos.diaActual >= 14) ? "Examen Final de la Estación" : "Estación de Reposo"; break;
                        case 'estacion_completada': progHeader.innerText = "Estación Completada 🌿"; break;
                        case 'vista_discipulados': progHeader.innerText = "Biblioteca de Discipulado"; break;
                        case 'mapa_tema': progHeader.innerText = (TEMAS_DISCIPULADO[this.datos.temaActivoId] || {}).titulo || "Mapa del Tema"; break;
                        case 'vista_entrega': progHeader.innerText = "Discipulado — Entrega"; break;
                        case 'encuentro_biblioteca': progHeader.innerText = "Un Encuentro con el Espíritu Santo"; break;
                        case 'encuentro_nivel': progHeader.innerText = (NIVELES_ENCUENTRO_ESPIRITU.find(n => n.id === this.datos.nivelActivoEncuentroId) || {}).nombre || "Un Encuentro con el Espíritu Santo"; break;
                        case 'espacios': progHeader.innerText = "Espacios"; break;
                        case 'gracia_biblioteca': progHeader.innerText = "De Gracia Recibisteis, Dad de Gracia"; break;
                        case 'gracia_modulo': progHeader.innerText = (MODULOS_GRACIA_RECIBISTEIS.find(m => m.id === this.datos.moduloActivoGraciaId) || {}).nombre || "De Gracia Recibisteis, Dad de Gracia"; break;
                        default: progHeader.innerText = "";
                    }
                }

                switch (this.datos.faseActual) {
                    case 'bienvenida_guiada': viewport.innerHTML = VistaBienvenidaGuiada(); break;
                    case 'bienvenida': viewport.innerHTML = VistaBienvenida(); break;
                    case 'filtro_templo': viewport.innerHTML = VistaFiltroTemplo(); break;
                    case 'amad_test': viewport.innerHTML = VistaAmadTest(); break;
                    case 'tormenta_pastoral': viewport.innerHTML = VistaTormentaPastoral(); break;
                    case 'resync_timer': viewport.innerHTML = VistaResyncTimer(); iniciarReloj(); break;
                    case 'raah_confesion': viewport.innerHTML = VistaRaahConfesion(); break;
                    case 'netibot_gracia': viewport.innerHTML = VistaNetibotGracia(); break;
                    case 'halak_obras': viewport.innerHTML = VistaHalakObras(); break;
                    case 'sendero_dashboard': viewport.innerHTML = VistaSenderoDashboard(); break;
                    case 'checkpoint_evaluacion': viewport.innerHTML = VistaCheckpointEvaluacion(); break;
                    case 'estacion_completada': viewport.innerHTML = VistaEstacionCompletada(); break;
                    case 'vista_discipulados': viewport.innerHTML = VistaDiscipulados(); break;
                    case 'mapa_tema': viewport.innerHTML = VistaMapaTema(); break;
                    case 'vista_entrega': viewport.innerHTML = VistaEntregaDiscipulado(); break;
                    case 'encuentro_biblioteca': viewport.innerHTML = VistaEncuentroEspiritu(); break;
                    case 'encuentro_nivel': viewport.innerHTML = VistaNivelEncuentro(); break;
                    case 'espacios': viewport.innerHTML = VistaEspacios(); break;
                    case 'gracia_biblioteca': viewport.innerHTML = VistaDeGraciaRecibisteis(); break;
                    case 'gracia_modulo': viewport.innerHTML = VistaModuloGracia(); break;
                    default: viewport.innerHTML = VistaBienvenida();
                }
            }
        };

        // ===================================================================
        // FUNCIONES AUXILIARES Y MODALES (AYUDA / GLOSARIO)
        // ===================================================================

        function textClean(text) {
            return text.replace(/<[^>]*>/g, '').trim();
        }

        // Calcula el hash SHA-256 (hex) de un texto usando la Web Crypto API nativa
        // del navegador. Se usa para no guardar nunca la contraseña de un perfil en
        // texto plano dentro de localStorage — ver solicitarAccesoPerfil().
        async function hashTexto(texto) {
            const buffer = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
            return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Punto único de entrada a un perfil ya existente en el selector de arriba o
        // en la pantalla de bienvenida neutral. La primera vez que se entra a un
        // perfil se le pide al propio usuario definir una contraseña sencilla; las
        // siguientes veces se le pide que la ingrese. Esto es solo para evitar que
        // un miembro de la familia entre por error al espacio de otro — no es una
        // medida de seguridad real (ver AGENTS.md).
        async function solicitarAccesoPerfil(nombre) {
            const perfil = SendaEstado.perfiles[nombre];
            if (!perfil) return;

            if (!perfil.pinHash) {
                const nuevoPin = prompt(`Es la primera vez que entras al espacio de "${nombre}". Crea una contraseña sencilla (mínimo 4 caracteres) para que nadie más entre aquí por error:`);
                if (nuevoPin === null) { SendaEstado.actualizarSelectorUI(); return; }
                if (nuevoPin.trim().length < 4) {
                    alert("La contraseña debe tener al menos 4 caracteres.");
                    SendaEstado.actualizarSelectorUI();
                    return;
                }
                perfil.pinHash = await hashTexto(nuevoPin.trim());
                SendaEstado.guardarTodo();
            } else {
                const intento = prompt(`Ingresa la contraseña del perfil de "${nombre}":`);
                if (intento === null) { SendaEstado.actualizarSelectorUI(); return; }
                const intentoHash = await hashTexto(intento.trim());
                if (intentoHash !== perfil.pinHash) {
                    alert("Contraseña incorrecta.");
                    SendaEstado.actualizarSelectorUI();
                    return;
                }
            }

            SendaEstado.cargarPerfil(nombre);
        }

        // Permite volver a definir la contraseña de un perfil sin conocer la
        // anterior (ej. se olvidó). No borra ningún progreso — solo limpia el hash
        // guardado para que la próxima vez que se entre se pida una nueva.
        function restablecerPin(nombre) {
            if (!SendaEstado.perfiles[nombre]) return;
            const confirmado = confirm(`¿Restablecer la contraseña del perfil de "${nombre}"? Se te pedirá crear una nueva la próxima vez que entres. Tu progreso no se pierde.`);
            if (!confirmado) return;
            SendaEstado.perfiles[nombre].pinHash = null;
            SendaEstado.guardarTodo();
            alert("Contraseña restablecida.");
        }

        // Cambia la contraseña de un perfil YA ABIERTO, pidiendo primero la
        // contraseña actual como confirmación de identidad — a diferencia de
        // restablecerPin(), que es para cuando la contraseña se olvidó por
        // completo y no se puede confirmar la actual.
        async function cambiarPin(nombre) {
            const perfil = SendaEstado.perfiles[nombre];
            if (!perfil) return;

            const actual = prompt(`Para cambiar tu contraseña, ingresa primero la contraseña actual del perfil de "${nombre}":`);
            if (actual === null) return;
            const actualHash = await hashTexto(actual.trim());
            if (actualHash !== perfil.pinHash) {
                alert("La contraseña actual no coincide.");
                return;
            }

            const nueva = prompt("Ingresa tu nueva contraseña (mínimo 4 caracteres):");
            if (nueva === null) return;
            if (nueva.trim().length < 4) {
                alert("La nueva contraseña debe tener al menos 4 caracteres.");
                return;
            }

            perfil.pinHash = await hashTexto(nueva.trim());
            SendaEstado.guardarTodo();
            alert("Tu contraseña se actualizó correctamente.");
        }

        function registrarPerfilInicial() {
            const input = document.getElementById('nombre-inicial');
            if (input && input.value.trim() !== "") {
                const nombre = textClean(input.value);
                SendaEstado.perfiles[nombre] = obtenerPerfilBase(nombre);
                // Solo un perfil recién creado arranca en la bienvenida guiada —
                // reiniciarCamino() no toca faseActual, así que un perfil existente
                // que reinicia su estación NO la vuelve a ver (no se pidió eso).
                SendaEstado.perfiles[nombre].faseActual = 'bienvenida_guiada';
                SendaEstado.guardarTodo();
                SendaEstado.actualizarSelectorUI();
                solicitarAccesoPerfil(nombre);
            } else {
                alert("Por favor, ingresa un nombre para comenzar.");
            }
        }

        function VistaBienvenidaGuiada() {
            const slide = SLIDES_BIENVENIDA_GUIADA[slideBienvenidaGuiada] || SLIDES_BIENVENIDA_GUIADA[0];
            const esUltima = slideBienvenidaGuiada === SLIDES_BIENVENIDA_GUIADA.length - 1;
            return `
                <div class="text-center space-y-6 py-8 max-w-sm mx-auto">
                    <div class="flex justify-center gap-1.5">
                        ${SLIDES_BIENVENIDA_GUIADA.map((_, i) => `<span class="w-1.5 h-1.5 rounded-full ${i === slideBienvenidaGuiada ? 'bg-senda-oliva' : 'bg-stone-200'}"></span>`).join('')}
                    </div>
                    <span class="text-5xl block">${slide.icono}</span>
                    <h2 class="serif-title text-2xl font-medium text-senda-texto leading-snug">${slide.titulo}</h2>
                    ${slide.texto ? `<p class="text-base text-stone-600 font-light leading-relaxed">${slide.texto}</p>` : ''}
                    <div class="space-y-3 pt-2">
                        <button onclick="${esUltima ? 'terminarBienvenidaGuiada()' : 'avanzarBienvenidaGuiada()'}" class="w-full py-4 bg-senda-oliva hover:bg-opacity-95 text-white font-semibold rounded-2xl shadow-sm transition-all text-base tracking-wide">
                            ${esUltima ? 'Comenzar mi camino' : 'Siguiente →'}
                        </button>
                        <button onclick="terminarBienvenidaGuiada()" class="text-xs text-stone-400 hover:text-stone-600 underline">
                            ${esUltima ? 'Ya la conozco' : 'Saltar'}
                        </button>
                    </div>
                </div>
            `;
        }

        function avanzarBienvenidaGuiada() {
            slideBienvenidaGuiada = Math.min(slideBienvenidaGuiada + 1, SLIDES_BIENVENIDA_GUIADA.length - 1);
            SendaEstado.renderizarFaseActual();
        }

        function terminarBienvenidaGuiada() {
            SendaEstado.datos.bienvenidaGuiadaVista = true;
            SendaEstado.guardar();
            slideBienvenidaGuiada = 0;
            if (faseAntesDeBienvenidaGuiada) {
                const destino = faseAntesDeBienvenidaGuiada;
                faseAntesDeBienvenidaGuiada = null;
                SendaEstado.irAFase(destino);
            } else {
                SendaEstado.irAFase('bienvenida');
            }
        }

        // Enlace desde "Ayuda" para volver a verla en cualquier momento — a
        // diferencia del disparo automático (solo perfiles nuevos), esta sí
        // puede abrirse desde cualquier fase, para cualquier perfil.
        function verBienvenidaGuiadaDeNuevo() {
            if (!SendaEstado.perfilActivo) return;
            cerrarModalAyuda();
            const fasesDelModulo = ['bienvenida_guiada'];
            if (!fasesDelModulo.includes(SendaEstado.datos.faseActual)) {
                faseAntesDeBienvenidaGuiada = SendaEstado.datos.faseActual;
            }
            slideBienvenidaGuiada = 0;
            SendaEstado.irAFase('bienvenida_guiada');
        }

        // --- "Espacios": menú consolidado de Discipulados / Encuentro / Gracia ---
        function irAEspacios() {
            if (!SendaEstado.perfilActivo) {
                alert("Primero selecciona o crea tu perfil para ver los espacios disponibles.");
                return;
            }
            const fasesDelModulo = ['espacios'];
            if (!fasesDelModulo.includes(SendaEstado.datos.faseActual)) {
                faseAntesDeEspacios = SendaEstado.datos.faseActual;
            }
            SendaEstado.irAFase('espacios');
        }

        function salirDeEspacios() {
            if (faseAntesDeEspacios) {
                const destino = faseAntesDeEspacios;
                faseAntesDeEspacios = null;
                SendaEstado.irAFase(destino);
            } else if (SendaEstado.datos.tipoRuta) {
                SendaEstado.irAFase('sendero_dashboard');
            } else {
                SendaEstado.irAFase('bienvenida');
            }
        }

        // --- "De Gracia Recibisteis, Dad de Gracia" ---
        function irADeGraciaRecibisteis() {
            if (!SendaEstado.perfilActivo) {
                alert("Primero selecciona o crea tu perfil para acceder a este espacio.");
                return;
            }
            const fasesDelModulo = ['gracia_biblioteca', 'gracia_modulo'];
            if (!fasesDelModulo.includes(SendaEstado.datos.faseActual)) {
                faseAntesDeGracia = SendaEstado.datos.faseActual;
            }
            SendaEstado.irAFase('gracia_biblioteca');
        }

        function salirDeGracia() {
            if (faseAntesDeGracia) {
                const destino = faseAntesDeGracia;
                faseAntesDeGracia = null;
                SendaEstado.irAFase(destino);
            } else if (SendaEstado.datos.tipoRuta) {
                SendaEstado.irAFase('sendero_dashboard');

                SendaEstado.irAFase('bienvenida');

        function guardarRespuestaGracia(moduloId) {
            const txt = document.getElementById('texto-respuesta-gracia');
            const btn = document.getElementById('btn-guardar-respuesta-gracia');
            if (!txt || !btn) return;
            if (!SendaEstado.datos.respuestasGracia) SendaEstado.datos.respuestasGracia = {};
            SendaEstado.datos.respuestasGracia[moduloId] = textClean(txt.value);

            // Avanza el "siguiente sugerido" — nunca bloquea, solo orienta.
            const modulo = MODULOS_GRACIA_RECIBISTEIS.find(m => m.id === moduloId);
            if (modulo && (SendaEstado.datos.moduloMaxGracia || 1) <= modulo.orden) {
                SendaEstado.datos.moduloMaxGracia = Math.min(modulo.orden + 1, MODULOS_GRACIA_RECIBISTEIS.length);
            }
            SendaEstado.guardar();

            const habiaTexto = SendaEstado.datos.respuestasGracia[moduloId] !== "";
            btn.innerText = "¡Respuesta Guardada!";
            btn.classList.add('bg-emerald-600');
            btn.classList.remove('bg-senda-oliva');
            setTimeout(() => {
                btn.innerText = habiaTexto ? "Actualizar mi Respuesta" : "Guardar mi Respuesta";
                btn.classList.remove('bg-emerald-600');
                btn.classList.add('bg-senda-oliva');
            }, 2000);
        }

        function eliminarPerfil(nombre) {
            if (!SendaEstado.perfiles[nombre]) return;
            const confirmado = confirm(`¿Eliminar el perfil de "${nombre}"? Se perderá todo su progreso, respuestas y discipulados completados. Esta acción no se puede deshacer.`);

            delete SendaEstado.perfiles[nombre];

            if (SendaEstado.perfilActivo === nombre) {

        // funciona igual sin importar qué plataforma esté embebida.
        function pantallaCompletaVideo() {
            const iframe = document.getElementById('modal-video-iframe');
            if (!iframe) return;
            if (iframe.requestFullscreen) {

                iframe.mozRequestFullScreen();

                iframe.msRequestFullscreen();
            }
        }

        function responderPregunta(valor, btnEl) {
            if (procesandoPregunta) return;
            procesandoPregunta = true;

            // Feedback visual inmediato: la opción elegida se marca en oliva sólido,
            // las demás se atenúan — luego, tras una breve pausa, se avanza a la
            // siguiente pregunta (o se procesa el diagnóstico si era la última).
            if (btnEl && btnEl.parentElement) {
                Array.from(btnEl.parentElement.children).forEach(b => {
                    b.onclick = null;
                    b.classList.remove('hover:border-senda-oliva', 'hover:bg-senda-fondo', 'bg-stone-50/60', 'text-stone-700');
                    if (b === btnEl) {
                        b.classList.add('bg-senda-oliva', 'border-senda-oliva', 'text-white', 'shadow-md');
                    } else {
                        b.classList.add('opacity-30');
                    }
                });
            }

            const index = SendaEstado.datos.indicePregunta || 0;
            const pre = PREGUNTAS_TEST[index];
            SendaEstado.datos.respuestasTest[pre.id] = valor;
            SendaEstado.guardar();

            setTimeout(() => {
                procesandoPregunta = false;
                if (index + 1 < PREGUNTAS_TEST.length) {
                    SendaEstado.datos.indicePregunta++;
                    SendaEstado.guardar();
                    SendaEstado.renderizarFaseActual();
                } else {
                    procesarDiagnostico();
                }
            }, 380);
        }

        function retrocederPregunta() {
            if (SendaEstado.datos.indicePregunta > 0) {
                SendaEstado.datos.indicePregunta--;
                SendaEstado.guardar();
                SendaEstado.renderizarFaseActual();
            }
        }

        function procesarDiagnostico() {
            let total = 0;
            const sintomasCriticosNuevos = [];
            SendaEstado.datos.sintomasCicloAnterior = SendaEstado.datos.sintomasCriticos || [];
            const sintomasAnterioresIds = SendaEstado.datos.sintomasCicloAnterior.map(s => s.id);

            if (!SendaEstado.datos.conteoCronicidad) SendaEstado.datos.conteoCronicidad = {};
            if (!SendaEstado.datos.victorias) SendaEstado.datos.victorias = [];

            for (let k in SendaEstado.datos.respuestasTest) {
                const valor = SendaEstado.datos.respuestasTest[k];
                total += valor;

                if (valor >= 2 && MEDICINA_TEOLOGICA[k]) {
                    const esPersistente = sintomasAnterioresIds.includes(k);
                    if (!SendaEstado.datos.conteoCronicidad[k]) SendaEstado.datos.conteoCronicidad[k] = 0;
                    SendaEstado.datos.conteoCronicidad[k]++;
                    sintomasCriticosNuevos.push({
                        id: k,
                        puntuacion: valor,
                        persistente: esPersistente,
                        consecutivos: SendaEstado.datos.conteoCronicidad[k],
                        ...MEDICINA_TEOLOGICA[k]
                    });
                } else if (valor < 2 && MEDICINA_TEOLOGICA[k]) {
                    const indexPasado = sintomasAnterioresIds.indexOf(k);
                    if (indexPasado !== -1) {
                        SendaEstado.datos.victorias.push({ id: k, raiz: MEDICINA_TEOLOGICA[k].raiz, fecha: new Date().toLocaleDateString() });
                    }
                    SendaEstado.datos.conteoCronicidad[k] = 0;
                }
            }

            SendaEstado.datos.resultadoCarga = total;
            SendaEstado.datos.sintomasCriticos = sintomasCriticosNuevos;
            const antiguoTipo = SendaEstado.datos.tipoRuta;
            let nuevoTipo = 'stable';

            if (total >= 18) { SendaEstado.datos.veredicto = "Yugo del Mundo (Cansancio Severo)"; nuevoTipo = "severo"; }
            else if (total >= 9) { SendaEstado.datos.veredicto = "Carga Desequilibrada (Límite de Alerta)"; nuevoTipo = "alerta"; }
            else { SendaEstado.datos.veredicto = "Senda Estable (Busca Constancia)"; nuevoTipo = "stable"; }

            SendaEstado.datos.tipoRuta = nuevoTipo;
            SendaEstado.datos.indicePregunta = 0;
            SendaEstado.datos.alertaTormentaActiva = null;

            if (antiguoTipo) {
                const jerarquia = { 'stable': 1, 'alerta': 2, 'severo': 3 };
                if (jerarquia[nuevoTipo] > jerarquia[antiguoTipo]) {
                    SendaEstado.datos.alertaTormentaActiva = determinarTipoTormenta(sintomasCriticosNuevos);
                }
            }

            SendaEstado.datos.historicoRuta = antiguoTipo;
            SendaEstado.guardar();

            if (SendaEstado.datos.alertaTormentaActiva) SendaEstado.irAFase('tormenta_pastoral');
            else SendaEstado.irAFase('resync_timer');
        }

        // Determina qué tormenta pastoral corresponde según qué raíz(es) realmente pesan más
        // en este ciclo, en vez de elegir al azar. Usa la severidad MÁXIMA como criterio principal
        // (evita que 'autosuficiencia' gane solo por tener más raíces mapeadas que 'arena' o 'espinas')
        // y la suma total como desempate cuando dos tipos comparten la misma severidad máxima.
        function determinarTipoTormenta(sintomasCriticos) {
            const alertasPosibles = ['arena', 'espinas', 'autosuficiencia'];
            if (!sintomasCriticos || sintomasCriticos.length === 0) {
                return alertasPosibles[Math.floor(Math.random() * alertasPosibles.length)];
            }
            const stats = { arena: { max: 0, suma: 0 }, espinas: { max: 0, suma: 0 }, autosuficiencia: { max: 0, suma: 0 } };
            sintomasCriticos.forEach(s => {
                const tipo = CATEGORIA_TORMENTA[s.id];
                if (tipo) {
                    stats[tipo].suma += s.puntuacion;
                    if (s.puntuacion > stats[tipo].max) stats[tipo].max = s.puntuacion;
                }
            });
            let mejorTipo = alertasPosibles[0];
            let mejorMax = -1, mejorSuma = -1;
            for (let tipo of alertasPosibles) {
                const { max, suma } = stats[tipo];
                if (max > mejorMax || (max === mejorMax && suma > mejorSuma)) {
                    mejorMax = max; mejorSuma = suma; mejorTipo = tipo;
                }
            }
            return mejorTipo;
        }

        // real la decide la configuración del sistema (Ajustes > Idioma y
        // entrada > Texto a voz > motor de Google > voz), no la página web.
        // Si esto no cambia nada en tu teléfono, esa es la vía confiable.
        function seleccionarVozPreferida() {
            if (!('speechSynthesis' in window)) return null;
            const voces = window.speechSynthesis.getVoices() || [];
            const vocesEspanol = voces.filter(v => v.lang && v.lang.toLowerCase().startsWith('es'));
            if (vocesEspanol.length === 0) return null;
            const patronMasculino = /male|hombre|masculin|diego|jorge|carlos|pablo|enrique/i;
            const candidato = vocesEspanol.find(v => patronMasculino.test(v.name));
            if (candidato) return candidato;
            // Sin pista por nombre: si hay más de una voz en español, probar
            // con la segunda — la primera suele ser la voz por defecto del
            // sistema, que en la mayoría de los dispositivos es femenina.
            return vocesEspanol.length > 1 ? vocesEspanol[1] : vocesEspanol[0];
        }

        // Lee un texto en voz alta con la Web Speech API del navegador (sin
        // depender de ningún audio externo — evita el problema de origen/
        // Referer que tuvimos con los videos, ver Error 153 en el documento
        // de contexto). rate más bajo que el default para una lectura pausada,
        // acorde al tono contemplativo del retiro.
        function leerPasajeEnVoz(texto) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = 'es-ES';
            utterance.rate = 0.85;
            const vozPreferida = seleccionarVozPreferida();
            if (vozPreferida) utterance.voice = vozPreferida;
            const boton = document.getElementById('btn-escuchar-pasaje');
            if (boton) boton.innerText = '⏹ Detener lectura';
            utterance.onend = () => { if (boton) boton.innerText = '🔊 Escuchar pasaje'; };
            utterance.onerror = () => { if (boton) boton.innerText = '🔊 Escuchar pasaje'; };
            window.speechSynthesis.speak(utterance);
        }

        function alternarLecturaVoz(texto) {
            if (!('speechSynthesis' in window)) return;
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                const boton = document.getElementById('btn-escuchar-pasaje');
                if (boton) boton.innerText = '🔊 Escuchar pasaje';
            } else {
                leerPasajeEnVoz(texto);
            }
        }

        // el texto directo desde PROTOCOLOS_LECTURA, la misma fuente que ya

        function leerAlimentoDiarioDeHoy() {

        function completarDiaActual() {
            const diaAct = SendaEstado.datos.diaActual || 1;

            if (!SendaEstado.datos.registroDias[diaAct] || typeof SendaEstado.datos.registroDias[diaAct] !== 'object') {
                SendaEstado.datos.registroDias[diaAct] = { completado: false, obrasCompletadas: [] };
            }
            const registroHoy = SendaEstado.datos.registroDias[diaAct];
            const totalObras = (SendaEstado.datos.obrasSeleccionadas || []).length;
            const hechas = registroHoy.obrasCompletadas.length;

            if (totalObras > 0 && hechas < totalObras) {
                const conf = confirm("Aún no has marcado todas tus veredas de hoy. ¿Deseas completar el día de todos modos? (Recuerda que no hay condenación en Cristo, esto es un ritmo de gracia, no de ley).");
                if (!conf) return;
            }

            registroHoy.completado = true;

            // --- Corrección de flujo de 14 días ---
            // El día 7 dispara una estación de reposo intermedia (re-examen) y luego
            // continúa hasta el día 14. El día 14 dispara un examen final propio y
            // concluye la estación, en vez de repetir el mensaje "completaste 7 días"
            // y quedar en bucle sobre el mismo día.
            const esUltimoDia = diaAct >= 14;
            const esCheckpointSemanal = diaAct === 7;

            if (!esUltimoDia) {
                SendaEstado.datos.diaActual = diaAct + 1;
            }

            if (esUltimoDia || esCheckpointSemanal) {
                SendaEstado.datos.faseActual = 'checkpoint_evaluacion';
            }
            // En cualquier otro día, faseActual permanece en 'sendero_dashboard'
            // y diaActual ya fue avanzado: el próximo render muestra el día siguiente.

            SendaEstado.guardar();
            SendaEstado.renderizarFaseActual();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderAccordionSection(id, icono, titulo, contenidoHtml, abiertoPorDefecto) {

                }).catch(() => {
                    alert("No se pudo copiar automáticamente. Aquí está tu mensaje para copiarlo manualmente:\n\n" + mensaje);

            }

        // ===================================================================
        // MÓDULO DE DISCIPULADOS PROFUNDOS — navegación y vistas
        // ===================================================================
        // Jerarquía de navegación (3 niveles, con "volver" propio en cada uno):
        //   Cabecera "📚 Discipulados"
        //     -> vista_discipulados  (biblioteca: cuadrícula de temas)
        //       -> mapa_tema         (línea de tiempo de un tema)
        //         -> vista_entrega   (video + lectura + reto de asimilación)
        // Al entrar se recuerda la fase de origen en faseAntesDeDiscipulado, así
        // que salirDeDiscipulados() siempre devuelve al usuario exactamente a
        // donde estaba (incluso si estaba a mitad del examen Amad, por ejemplo),
        // en vez de asumir siempre 'sendero_dashboard'.

        function irAVistaDiscipulados() {
            if (!SendaEstado.perfilActivo) {
                alert("Primero selecciona o crea tu perfil para acceder a los discipulados.");
                return;
            }
            const fasesDelModulo = ['vista_discipulados', 'mapa_tema', 'vista_entrega'];
            if (!fasesDelModulo.includes(SendaEstado.datos.faseActual)) {
                faseAntesDeDiscipulado = SendaEstado.datos.faseActual;
            }
            SendaEstado.irAFase('vista_discipulados');
        }

        function salirDeDiscipulados() {
            if (faseAntesDeDiscipulado) {
                SendaEstado.irAFase(faseAntesDeDiscipulado);
            } else if (SendaEstado.datos.tipoRuta) {
                // Ya completó al menos un ciclo del examen -> el dashboard tiene contenido real
                SendaEstado.irAFase('sendero_dashboard');
            } else {
                // Perfil nuevo, sin diagnóstico aún -> el dashboard estaría vacío;
                // lo correcto es retomar desde la bienvenida.
                SendaEstado.irAFase('bienvenida');
            }
        }

        function irAEncuentroEspiritu() {
            if (!SendaEstado.perfilActivo) {
                alert("Primero selecciona o crea tu perfil para acceder a este espacio.");
                return;
            }
            const fasesDelModulo = ['encuentro_biblioteca', 'encuentro_nivel'];
            if (!fasesDelModulo.includes(SendaEstado.datos.faseActual)) {
                faseAntesDeEncuentro = SendaEstado.datos.faseActual;

        function salirDeEncuentro() {
            if (faseAntesDeEncuentro) {
                SendaEstado.irAFase(faseAntesDeEncuentro);
            } else if (SendaEstado.datos.tipoRuta) {

        function guardarRespuestaEncuentro(nivelId) {

                SendaEstado.datos.nivelMaxEncuentro = Math.min(nivel.orden + 1, NIVELES_ENCUENTRO_ESPIRITU.length);

            btn.classList.add('bg-emerald-600');
            btn.classList.remove('bg-senda-oliva');
            setTimeout(() => {
                btn.innerText = habiaTexto ? "Actualizar mi Respuesta" : "Guardar mi Respuesta";
                btn.classList.remove('bg-emerald-600');

        function irAMapaTema(temaId) {
            SendaEstado.datos.temaActivoId = temaId;
            SendaEstado.irAFase('mapa_tema');
        }

        // Igual que irAMapaTema, pero pensada para el enlace de "El Gran Médico"
        // dentro del dashboard: recuerda la fase de origen (sendero_dashboard) tal
        // como lo hace irAVistaDiscipulados, para que "← Volver" en el mapa del
        // tema no se pierda el hilo de dónde venía el usuario.
        function irADiscipuladoSugerido(temaId) {
            if (!SendaEstado.perfilActivo) return;
            const fasesDelModulo = ['vista_discipulados', 'mapa_tema', 'vista_entrega'];

        // Busca una entrega por id recorriendo todos los temas, sin depender de
        // que temaActivoId ya esté fijado — hace la navegación más robusta.
        function encontrarEntregaDiscipulado(entregaId) {
            for (let claveTema in TEMAS_DISCIPULADO) {
                const tema = TEMAS_DISCIPULADO[claveTema];
                const entrega = tema.entregas.find(e => e.id === entregaId);
                if (entrega) return { tema, entrega };
            }
            return null;
        }

        // ===================================================================
        // CONSTRUCCIÓN DE URL DE VIDEO — YouTube o Vimeo
        // ===================================================================
        // ¿DÓNDE PEGAR TU VIDEO REAL? En la constante TEMAS_DISCIPULADO (arriba),
        // busca la entrega por su id (ej. 'ira_1') y reemplaza el string del campo
        // 'video_id' — NO hace falta tocar esta función para nada.
        // Acepta CUALQUIERA de estos 4 formatos en 'video_id':
        //   1. Solo el ID de YouTube:      'dQw4w9WgXcQ'
        //   2. Link completo de YouTube:   'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
        //   3. Link corto de YouTube:      'https://youtu.be/dQw4w9WgXcQ'
        //   4. Link completo de Vimeo:     'https://vimeo.com/76979871'
        // La función detecta el formato automáticamente y arma la URL de embed
        // correcta — puedes pegar tal cual copiaste el link desde el navegador.
        function construirUrlEmbedVideo(video_id) {
            if (!video_id) return '';
            const valor = video_id.trim();

            let match = valor.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match) return `https://drive.google.com/file/d/${match[1]}/preview`;

            match = valor.match(/vimeo\.com\/(?:video\/)?(\d+)/);
            if (match) return `https://player.vimeo.com/video/${match[1]}`;

            match = valor.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube-nocookie.com/embed/${match[1]}`;

            match = valor.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube-nocookie.com/embed/${match[1]}`;

            match = valor.match(/youtube(?:-nocookie)?\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube-nocookie.com/embed/${match[1]}`;

            // Por defecto: se asume que 'valor' ya es un ID de YouTube directo.
            return `https://www.youtube-nocookie.com/embed/${valor}`;
        }

        // Hermana de construirUrlEmbedVideo(): arma el link para "ver directamente
        // en la plataforma" (fuera del iframe embebido). Se usa en el enlace de
        // respaldo del modal de video — algunos videos no embeben de forma
        // confiable según el navegador/origen desde el que se abra el archivo
        // .html (ej. abierto como content:// en Android en vez de http/https),
        // así que el enlace directo queda SIEMPRE visible, no solo cuando falla.
        // Mismos formatos de entrada que construirUrlEmbedVideo() — si se
        // agrega un formato nuevo ahí, replicar el cambio acá también.
        function construirUrlVerVideo(video_id) {
            if (!video_id) return '';
            const valor = video_id.trim();

            let match = valor.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match) return `https://drive.google.com/file/d/${match[1]}/view`;

            match = valor.match(/vimeo\.com\/(?:video\/)?(\d+)/);
            if (match) return `https://vimeo.com/${match[1]}`;

            match = valor.match(/[?&]v=([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube.com/watch?v=${match[1]}`;

            match = valor.match(/youtu\.be\/([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube.com/watch?v=${match[1]}`;

            match = valor.match(/youtube(?:-nocookie)?\.com\/embed\/([a-zA-Z0-9_-]{6,})/);
            if (match) return `https://www.youtube.com/watch?v=${match[1]}`;

            // Por defecto: se asume que 'valor' ya es un ID de YouTube directo.
            return `https://www.youtube.com/watch?v=${valor}`;
        }

        function completarEntregaDiscipulado(entregaId) {
            const txt = document.getElementById('texto-asimilacion');
            if (!SendaEstado.datos.progresoDiscipulado) SendaEstado.datos.progresoDiscipulado = {};
            SendaEstado.datos.progresoDiscipulado[entregaId] = {
                completado: true,
                respuesta: txt ? textClean(txt.value) : ''
            };
            SendaEstado.guardar();
            SendaEstado.irAFase('mapa_tema');
        }

        // --- Vista 1: Biblioteca (cuadrícula de temas principales) ---
        function VistaDiscipulados() {
            // La Biblioteca General ordena EXCLUSIVAMENTE por orden_reino — a
            // diferencia de la sugerencia del dashboard, que prioriza por
            // severidad del síntoma detectado. Un tema sin orden_reino (no
            // debería pasar, pero por robustez) se va al final, no rompe el sort.
            const temas = Object.values(TEMAS_DISCIPULADO).sort((a, b) => (a.orden_reino ?? 999) - (b.orden_reino ?? 999));
            const progreso = SendaEstado.datos.progresoDiscipulado || {};
            return `
                <div class="space-y-8">
                    <div class="flex justify-start">
                        <button onclick="salirDeDiscipulados()" class="text-xs text-stone-600 hover:text-stone-600 underline">← Volver a mi caminar diario</button>
                    </div>
                    <div class="text-center space-y-2">
                        <span class="text-xs uppercase tracking-[0.2em] text-senda-tierra font-semibold">Discipulado Profundo</span>
                        <h2 class="serif-title text-3xl md:text-4xl font-medium text-senda-texto">Biblioteca de Series</h2>
                        <p class="text-sm text-stone-600 font-light max-w-md mx-auto leading-relaxed">Cada serie te lleva de discernir a manifestar, un paso a la vez, bajo el señorío de Jesucristo.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${temas.map(tema => {
                            const total = tema.entregas.length;
                            const completadas = tema.entregas.filter(e => progreso[e.id] && progreso[e.id].completado).length;
                            const porcentaje = total > 0 ? Math.round((completadas / total) * 100) : 0;
                            return `
                            <button onclick="irAMapaTema('${tema.id}')" class="opcion-btn text-left p-6 rounded-[2rem] border-2 border-stone-200 bg-white hover:border-senda-oliva/50 hover:shadow-md transition-all space-y-3">

                            <p class="serif-title text-lg text-senda-texto italic leading-relaxed">"${entrega.ancla_texto}"</p>
                            <span class="text-[11px] font-bold text-senda-tierra uppercase tracking-widest">${entrega.ancla_ref || tema.pasajeAncla}</span>
                        </div>
                    ` : ''}

                    ${tieneEstructuraVerdadTestimonio ? `
                        <div class="bg-white p-5 md:p-6 rounded-2xl border border-stone-200 space-y-2">
                            <span class="text-xs font-bold text-senda-oliva uppercase tracking-widest">La Verdad</span>
                            <p class="text-base text-stone-700 leading-relaxed font-light">${entrega.verdad}</p>
                        </div>
                        <div class="bg-white p-5 md:p-6 rounded-2xl border border-stone-200 space-y-2">
                            <span class="text-xs font-bold text-senda-oliva uppercase tracking-widest">El Testimonio</span>
                            <p class="text-base text-stone-700 leading-relaxed font-light">${entrega.testimonio}</p>
                        </div>
                    ` : `
                        <div class="bg-white p-5 md:p-6 rounded-2xl border border-stone-200 space-y-2">
                            <span class="text-xs font-bold text-senda-oliva uppercase tracking-widest">Lectura</span>
                            <p class="text-base text-stone-700 leading-relaxed font-light">${entrega.contenido}</p>
                        </div>
                    `}

                    <div class="bg-senda-fondo p-5 md:p-6 rounded-2xl border border-stone-200/60 space-y-3">
                        <span class="text-xs font-bold text-senda-tierra uppercase tracking-widest">Reto de Asimilación</span>
                        <p class="text-sm text-stone-600 italic leading-relaxed">${entrega.reto_asimilacion}</p>
                        <textarea id="texto-asimilacion" placeholder="Escribe tu respuesta aquí..." class="w-full h-28 p-4 text-base rounded-2xl border border-stone-200 focus:outline-none focus:border-senda-oliva bg-white resize-none font-light leading-relaxed">${progresoActual.respuesta || ''}</textarea>
                    </div>

                    <div class="space-y-3 max-w-sm mx-auto pt-2">
                        <button onclick="completarEntregaDiscipulado('${entrega.id}')" class="w-full py-4 bg-senda-oliva hover:bg-opacity-95 text-white font-bold rounded-2xl shadow-md transition-all tracking-wide">
                            ${progresoActual.completado ? '✓ Actualizar Respuesta' : 'Completar y Guardar'}
                        </button>
                        <button onclick="SendaEstado.irAFase('mapa_tema')" class="w-full text-center py-2 text-xs text-stone-600 hover:text-stone-600 underline">← Volver al mapa de ${tema.titulo}</button>
                    </div>
                </div>
            `;
        }

        // ===================================================================
        // INICIALIZACIÓN DE LA APLICACIÓN
        // ===================================================================
        window.onload = () => {
            SendaEstado.inicializar();
        };
    </script>
</body>
</html>
