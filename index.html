<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retorno a la Persona de Jesucristo — La Senda Antigua</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        senda: {
                            fondo: '#FAF7F2',
                            tierra: '#8C6239',
                            oliva: '#4A5D4E',
                            texto: '#2C3531',
                            oro: '#D4AF37',
                            rojoSuave: '#E29587',
                            cremaFuerte: '#F2ECE1'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF7F2;
            color: #2C3531;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .serif-title {
            font-family: 'Playfair Display', serif;
        }
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .disolver {
            animation: disolverTexto 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes disolverTexto {
            to {
                opacity: 0;
                filter: blur(15px);
                transform: translateY(-30px);
            }
        }
        .rebote-suave {
            animation: rebote 2.2s infinite ease-in-out;
        }
        @keyframes rebote {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(6px); }
        }
        /* Acordeón compacto del dashboard: cada sección se expande/colapsa
           animando max-height, evitando el scroll largo continuo. */
        .accordion-content {
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        /* Feedback visual moderno para botones de opción/selección (toggles) */
        .opcion-btn {
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .opcion-btn:hover {
            transform: translateY(-1px);
        }
        .opcion-btn:active {
            transform: translateY(0);
        }
        /* Respeta preferencia de movimiento reducido */
        @media (prefers-reduced-motion: reduce) {
            .fade-in, .disolver, .rebote-suave, .opcion-btn, .accordion-content {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body class="bg-senda-fondo text-senda-texto selection:bg-senda-oliva selection:text-white flex flex-col min-h-screen">

    <!-- CABECERA DE LA APP -->
    <header class="w-full max-w-2xl mx-auto px-6 pt-8 pb-4 flex flex-col space-y-4 md:space-y-0 md:flex-row md:justify-between md:items-center border-b border-stone-200/40">
        <div id="logo-senda" class="flex items-center space-x-3 cursor-pointer">
            <span class="text-senda-oliva text-4xl font-light">𐎵</span>
            <div class="flex flex-col">
                <span class="text-sm uppercase tracking-[0.2em] font-extrabold text-senda-oliva">Retorno a Jesucristo</span>
                <span class="text-[10px] uppercase tracking-[0.15em] font-medium text-senda-tierra">La Senda Antigua</span>
            </div>
        </div>

        <div class="flex flex-wrap items-center justify-between md:justify-end gap-2">
            <div class="flex items-center space-x-2 bg-stone-200/40 px-3 py-1.5 rounded-2xl border border-stone-300/20">
                <span class="text-sm">👤</span>
                <select id="selector-perfiles" class="bg-transparent text-sm font-semibold text-senda-texto focus:outline-none cursor-pointer">
                </select>
                <button id="btn-nuevo-perfil" class="text-sm text-senda-oliva font-bold pl-2 hover:text-opacity-70" title="Añadir miembro familiar">
                    + Nuevo
                </button>
            </div>
            <button id="btn-cambiar-pin" class="hidden flex items-center space-x-1 px-3 py-1.5 rounded-full bg-senda-tierra/10 hover:bg-senda-tierra/20 text-xs text-senda-tierra transition-all font-semibold" title="Cambiar la contraseña de este perfil">
                <span>🔑 Cambiar contraseña</span>
            </button>
            <button id="btn-cerrar-sesion" class="hidden flex items-center space-x-1 px-3 py-1.5 rounded-full bg-stone-200/60 hover:bg-stone-200 text-xs text-stone-700 transition-all font-semibold" title="Cerrar sesión y volver a la lista de perfiles">
                <span>🚪 Cerrar sesión</span>
            </button>
            <button onclick="irAVistaDiscipulados()" class="flex items-center space-x-1 px-3 py-1.5 rounded-full bg-senda-oliva/10 hover:bg-senda-oliva/20 text-xs text-senda-oliva transition-all font-semibold">
                <span>📚 Discipulados</span>
            </button>
            <button onclick="irAEncuentroEspiritu()" class="flex items-center space-x-1 px-3 py-1.5 rounded-full bg-senda-oro/10 hover:bg-senda-oro/20 text-xs text-senda-tierra transition-all font-semibold">
                <span>🕊️ Encuentro</span>
            </button>
            <button onclick="abrirGlosario()" class="text-xs uppercase tracking-wider font-semibold text-senda-tierra hover:underline bg-senda-cremaFuerte/60 px-3 py-1.5 rounded-xl">
                📙 Glosario
            </button>
            <button onclick="abrirModalAyuda('global')" class="flex items-center space-x-1 px-3 py-1.5 rounded-full bg-stone-200/60 hover:bg-stone-200 text-xs text-stone-700 transition-all font-semibold">
                <span>❓ Ayuda</span>
            </button>
        </div>
    </header>

    <!-- CONTENEDOR CENTRAL DINÁMICO -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-8 max-w-2xl mx-auto w-full">
        <div class="w-full max-w-xl px-4 mb-3 flex justify-start">
            <span id="progreso-header" class="text-xs uppercase tracking-[0.2em] text-senda-tierra font-bold"></span>
        </div>

        <div id="app-viewport" class="w-full max-w-xl bg-white rounded-[2.5rem] p-6 md:p-10 shadow-sm border border-stone-100/80 relative">
        </div>
    </main>

    <!-- VENTANA EMERGENTE DE AYUDA -->
    <div id="modal-ayuda" class="fixed inset-0 bg-stone-900/40 backdrop-blur-md flex items-center justify-center p-4 hidden z-50 transition-all">
        <div class="bg-white rounded-[2rem] max-w-lg w-full p-8 space-y-6 shadow-2xl border border-stone-100 fade-in">
            <div class="flex justify-between items-start border-b border-stone-100 pb-4">
                <h3 id="modal-titulo" class="serif-title text-2xl md:text-3xl font-medium text-senda-texto">Ayuda de la Senda</h3>
                <button onclick="cerrarModalAyuda()" class="text-stone-600 hover:text-stone-700 text-2xl font-light">✕</button>
            </div>
            <div id="modal-contenido" class="text-base text-stone-600 leading-relaxed space-y-4 max-h-[60vh] overflow-y-auto pr-2">
            </div>
            <div class="pt-4">
                <button onclick="cerrarModalAyuda()" class="w-full py-4 bg-senda-oliva text-white text-base font-semibold rounded-2xl hover:bg-opacity-95 transition-all">
                    Entendido
                </button>
            </div>
        </div>
    </div>

    <!-- VENTANA EMERGENTE DE VIDEO (Súper Libro — biblioteca de discipulado) -->
    <div id="modal-video" class="fixed inset-0 bg-stone-900/60 backdrop-blur-md flex items-center justify-center p-4 hidden z-50 transition-all">
        <div class="bg-white rounded-[2rem] max-w-2xl w-full p-5 md:p-6 space-y-4 shadow-2xl border border-stone-100 fade-in">
            <div class="flex justify-between items-center">
                <h3 id="modal-video-titulo" class="serif-title text-lg md:text-xl font-medium text-senda-texto truncate pr-4">Video</h3>
                <button onclick="cerrarModalVideo()" class="text-stone-600 hover:text-stone-700 text-2xl font-light flex-shrink-0">✕</button>
            </div>
            <div class="rounded-2xl overflow-hidden border border-stone-200 bg-stone-900 aspect-video">
                <iframe id="modal-video-iframe" class="w-full h-full" src="" title="Video del discipulado" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>
            </div>
            <div class="flex items-center justify-center gap-5">
                <a id="modal-video-link-externo" href="#" target="_blank" rel="noopener" class="flex items-center justify-center gap-1 text-xs text-stone-600 hover:text-senda-oliva transition-all font-medium">
                    Abrir en YouTube ↗
                </a>
                <button onclick="pantallaCompletaVideo()" class="flex items-center justify-center gap-1 text-xs text-stone-600 hover:text-senda-oliva transition-all font-medium">
                    🔳 Pantalla completa
                </button>
            </div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="w-full max-w-xl mx-auto px-6 pb-8 pt-4 text-center">
        <p class="text-sm md:text-base text-stone-600 font-medium italic leading-relaxed">
            "Paraos en los caminos, y mirad, y preguntad por las sendas antiguas, cuál sea el buen camino, y andad por él, y hallaréis descanso para vuestra alma."
            <span class="block mt-1 font-semibold text-senda-tierra not-italic text-xs tracking-wider uppercase">— Jeremías 6:16</span>
        </p>
    </footer>

    <script>
        // ===================================================================
        // LA SENDA ANTIGUA — Estado global de control de flujo de confesión
        // ===================================================================
        let procesandoConfesion = false;
        let procesandoPregunta = false;
        // Estado (solo en memoria, no persistido) de qué secciones del acordeón
        // del dashboard están abiertas — sobrevive a los re-renders de la sesión.
        let accordionState = {};
        // Recuerda en qué fase estaba el usuario antes de entrar al módulo de
        // Discipulados, para poder devolverlo exactamente ahí al salir (no
        // persistido: si se recarga la página dentro del módulo, se asume
        // 'sendero_dashboard' como retorno seguro).
        let faseAntesDeDiscipulado = null;
        // Misma función que faseAntesDeDiscipulado, pero para el módulo
        // independiente "Un Encuentro con el Espíritu Santo" (ver sección 4.4
        // del documento de contexto). Variable de módulo, NO pertenece al
        // perfil — debe resetearse al cambiar de perfil en cargarPerfil(),
        // igual que faseAntesDeDiscipulado (ver bug documentado al respecto).
        let faseAntesDeEncuentro = null;

        // ===================================================================
        // DATOS TEOLÓGICOS Y DE CONTENIDO PASTORAL
        // ===================================================================
        const PREGUNTAS_TEST = [
            { id: 'f_cansancio', cat: "Templo Físico", texto: "¿Sientes un cansancio corporal constante y profundo que ni siquiera un sueño prolongado logra aliviar?", guia: "La fatiga física suele ser el primer síntoma de un alma que intenta sostenerse sola." },
            { id: 'idolatria_control', cat: "Idolatría (Carne)", texto: "¿Sientes que tu paz y estabilidad dependen críticamente de tener bajo perfecto control tu dinero, reputación o salud?", guia: "La idolatría ocurre cuando un aspecto creado ocupa el lugar del Creador como nuestra única fuente de seguridad." },
            { id: 'hechiceria_atajos', cat: "Hechicería / Control (Carne)", texto: "Cuando te invade la impotencia, ¿recurres a la manipulación, a forzar las decisiones de otros o a atajos rápidos para calmar la ansiedad?", guia: "La carne recurre al control (pharmakeia) para anestesiar la vulnerabilidad en vez de confiar en la soberanía de Dios." },
            { id: 'enemistades_muros', cat: "Enemistades / Pleitos (Carne)", texto: "¿Te descubres construyendo muros de hielo, retirando tu afecto o usando el silencio prolongado como castigo hacia quienes te ofenden?", guia: "El orgullo de la carne nos impulsa a buscar justicia por mano propia en lugar de descansar en el Defensor de tu alma." },
            { id: 'celos_comparacion', cat: "Celos / Envidia (Carne)", texto: "Al contemplar el éxito, las bendiciones o el descanso de otros, ¿sientes una sutil frustración o la sospecha de que Dios se ha olvidado de ti?", guia: "La envidia nace de la mentira de que el Padre celestial no tiene suficiente amor o provisión para todos Sus hijos." },
            { id: 'iras_irritacion', cat: "Iras / Contiendas (Carne)", texto: "¿Experimentas una irritación interna persistente que brota con facilidad ante los errores cotidianos de la gente que te rodea?", guia: "La ira explosiva suele delatar un espíritu exhausto que no tolera la debilidad de los demás porque no soporta la suya propia." },
            { id: 'orgullo_autosuficiencia', cat: "Orgullo / Autosuficiencia (Carne)", texto: "¿Te cuesta pedir ayuda, delegar responsabilidades o reconocer ante Dios tus debilidades por temor a parecer imperfecto?", guia: "El orgullo nos susurra la mentira de que debemos ser autosuficientes para ser dignos de amor y aprobación." },
            { id: 'arrogancia_rigidez', cat: "Arrogancia (Carne)", texto: "¿Sientes a menudo la fuerte necesidad interna de demostrar que tienes la razón o de imponer tu método como el único correcto?", guia: "La arrogancia es miedo disfrazado de poder. Es un escudo rígido para proteger un corazón asustado." },
            { id: 'mansedumbre_control', cat: "Falta de Mansedumbre (Fruto)", texto: "¿Te resistes con aspereza o ansiedad interna cuando los planes cambian o cuando las circunstancias escapan de tus manos?", guia: "La mansedumbre no es cobardía; es fuerza bajo el perfecto control del Espíritu, aceptando el ritmo y la voluntad del Padre." },
            { id: 'humildad_rendimiento', cat: "Falta de Humildad (Fruto)", texto: "¿Sientes que tu valor o tu identidad ante Dios dependen directamente de tu productividad, tus buenas obras o tu activismo espiritual?", guia: "La humildad según Jesús nos libera de la obsesión de nosotros mismos, permitiéndonos recibir Su gracia incondicional." }
        ];

        const MEDICINA_TEOLOGICA = {
            celos_comparacion: { raiz: "Envidia y Comparación", sintoma: "Palpitaciones constantes, insomnio por mirar y medir el propio valor con el éxito ajeno.", pasaje: "Proverbios 14:30", textoBiblico: "El corazón apacible es vida de la carne; mas la envidia es carcoma de los huesos.", medicina: "La provisión del Padre es perfecta y suficiente para hoy. El valor de una vida no se mide con la regla ajena, sino con la mirada de Dios.", anclajeCorporal: "Colocar la mano derecha en el centro del pecho. Respirar hondo sintiendo las palpitaciones e imaginar a Jesús entregando un regalo único, con un nombre escrito en él. Exhalar la necesidad de aprobación ajena.", medicinaPersistente: "La comparación sigue midiendo el valor propio por lo que otros tienen. El Señor responde: '¿Qué a ti? Sígueme tú.' Escribir hoy tres bendiciones silenciosas recibidas esta semana ayuda a rendirse al plan individual de Dios.", pasajePersistente: "Juan 21:22" },
            orgullo_autosuficiencia: { raiz: "Orgullo y Autosuficiencia", sintoma: "Cansancio cervical severo, migrañas por cargar responsabilidades que no corresponden.", pasaje: "1 Pedro 5:6-7", textoBiblico: "Humillaos, pues, bajo la poderosa mano de Dios, para que él os exalte cuando fuere tiempo; echando toda vuestra ansiedad sobre él, porque él tiene cuidado de vosotros.", medicina: "La necesidad de parecer perfecto puede rendirse. Está bien no poder con todo; Su poder se perfecciona en la debilidad.", anclajeCorporal: "Girar el cuello lentamente en círculos amplios. Al bajar la cabeza, susurrar: 'Suelto la carga de ser mi propio salvador'. Al levantarla, recibir el aire declarando Su gracia.", medicinaPersistente: "La coraza de creer que todo puede sostenerse en soledad suele mantenerse. Dios resiste a los soberbios, pero abraza con ternura a quienes se rinden débiles. Agendar hoy una hora para delegar o pedir ayuda en lo que agobia es un paso de humildad.", pasajePersistente: "Santiago 4:6" },
            idolatria_control: { raiz: "Idolatría del Control", sintoma: "Ansiedad generalizada, acidez estomacal, colon irritable, gastritis.", pasaje: "Jeremías 17:7-8", textoBiblico: "Bendito el varón que confía en el Señor... Porque será como el árbol plantado junto a las aguas... y en el año de sequía no se fatigará.", medicina: "Las riendas de finanzas, familia y futuro pueden soltarse. El control es una ilusión; la soberanía de Dios es una realidad segura.", anclajeCorporal: "Realizar una respiración 4-7-8 (inhalar en 4, retener en 7, exhalar en 8). Al exhalar, abrir y relajar las palmas de las manos mirando al cielo, simbolizando la entrega del control sobre el mañana.", medicinaPersistente: "La persistencia de la gastritis recuerda que la mente sigue queriendo ocupar el lugar de Dios. Escribir hoy el mayor temor en un papel, guardarlo dentro de una Biblia y decir: 'Padre, esto no me pertenece a mí, sino a Ti', es un paso concreto de entrega.", pasajePersistente: "Mateo 6:34" },
            enemistades_muros: { raiz: "Amargura y Resentimiento", sintoma: "Bruxismo severo, mandíbula tensa, opresión persistente en el pecho.", pasaje: "Hebreos 12:15", textoBiblico: "Mirad bien, no sea que alguno deje de alcanzar la gracia de Dios; que brotando alguna raíz de amargura, os perturbe, y por ella muchos sean contaminados.", medicina: "El perdón no justifica al ofensor; libera la mandíbula y el corazón de una prisión. La justicia puede entregarse al único Juez Justo.", anclajeCorporal: "Colocar la yema de los dedos sobre la articulación mandibular. Abrir la boca despacio sintiendo el estiramiento y exhalar profundamente diciendo en voz alta: 'Suelto el derecho a vengarme, yo perdono'.", medicinaPersistente: "Cargar esta amargura por más de dos semanas deja huella. La persistencia de la tensión mandibular es un llamado a dejar de justificar la herida. El perdón no es un sentimiento; es una decisión de obediencia radical. Escribir hoy el nombre de esa persona y entregarle al Señor el derecho a la justicia es un paso de libertad.", pasajePersistente: "Mateo 18:21-22" },
            iras_irritacion: { raiz: "Ira e Irritabilidad", sintoma: "Presión arterial alta, dolores de cabeza punzantes, hiperventilación.", pasaje: "Salmo 37:8", textoBiblico: "Deja la ira, y depura el enojo; no te excites en manera alguna a hacer lo malo.", medicina: "La irritación suele ser el grito de un sistema nervioso agotado. No es necesario reaccionar; respirar y permitir que el Espíritu temple el carácter es el camino.", anclajeCorporal: "Cerrar los ojos, respirar de manera profunda llevando el aire al abdomen y, al exhalar, dejar caer los hombros completamente sueltos. Permitir que el silencio rinda la necesidad de reaccionar.", medicinaPersistente: "El enojo constante suele denotar un espíritu exhausto que no tolera la debilidad ajena porque no abraza la propia. Entrar hoy en un silencio de palabras de 15 minutos, descansando en la paciencia de Cristo, es un paso de sanidad.", pasajePersistente: "Santiago 1:19-20" },
            f_cansancio: { raiz: "Fatiga Crónica del Templo", sintoma: "Fatiga suprarrenal, agotamiento muscular constante y necesidad de estimulantes para sostener el día.", pasaje: "Mateo 11:28-30", textoBiblico: "Vengan a mí los cansados y agobiados, y yo les daré verdadero descanso.", medicina: "El cuerpo no es una máquina de rendimiento; es templo del Espíritu. El ritmo que Dios nunca pidió sostener en soledad puede soltarse.", anclajeCorporal: "Sentarse y dejar caer los hombros por completo. Inhalar contando hasta cuatro y, al exhalar, susurrar: 'Tomo tu yugo, que es ligero'. Repetir tres veces.", medicinaPersistente: "El cuerpo sigue pidiendo auxilio aun durmiendo. Esto ya no es solo cansancio: es una señal de que hace falta descanso real, no solo espiritual sino físico. Apartar hoy un espacio para dormir o desconectarse sin culpa es un acto de buena mayordomía del templo.", pasajePersistente: "Éxodo 33:14" },
            hechiceria_atajos: { raiz: "Control y Atajos", sintoma: "Tensión en el pecho, respiración corta y una necesidad urgente de resolver todo de inmediato.", pasaje: "Isaías 30:15", textoBiblico: "En el reposo y la quietud confiada está tu verdadera fortaleza, no en tus propios atajos.", medicina: "La ansiedad busca atajos para calmarse rápido, pero solo la confianza en Su tiempo perfecto trae paz duradera. El control de los resultados puede soltarse.", anclajeCorporal: "Abrir las manos sobre las piernas y respirar lento. Al exhalar, decir en voz baja: 'Suelto el atajo, confío en Tu tiempo'.", medicinaPersistente: "Recurrir al control o la manipulación para calmar la impotencia suele repetirse. Esto revela una desconfianza profunda en la soberanía de Dios. Hoy, antes de forzar una situación, detenerse y orar primero es el camino de fe.", pasajePersistente: "Salmo 27:14" },
            arrogancia_rigidez: { raiz: "Arrogancia y Rigidez", sintoma: "Mandíbula apretada, tono de voz elevado y rigidez corporal al ser contradicho.", pasaje: "Proverbios 16:18", textoBiblico: "Antes de la caída siempre llega la soberbia del corazón.", medicina: "La necesidad de tener siempre la razón suele ser un escudo para no sentirse vulnerable. Jesús invita a soltar la armadura y dejarse corregir con mansedumbre.", anclajeCorporal: "Relajar conscientemente la mandíbula y los puños. Inclinar ligeramente la cabeza y decir: 'Prefiero la paz de Cristo a tener la razón'.", medicinaPersistente: "Imponer el propio criterio, como si de eso dependiera el valor personal, suele repetirse. Esa rigidez agota las relaciones y el propio espíritu. Hoy, ceder conscientemente en un punto que normalmente se defendería es un acto de mansedumbre.", pasajePersistente: "Filipenses 2:3-4" },
            mansedumbre_control: { raiz: "Resistencia al Cambio", sintoma: "Tensión muscular repentina, irritabilidad súbita e impaciencia física cuando los planes cambian.", pasaje: "Salmo 46:10", textoBiblico: "Quédate quieto y reconoce que Él es Dios, aun cuando todo cambie a tu alrededor.", medicina: "La mansedumbre no exige que todo salga como fue planeado; es fuerza rendida que confía en que Dios gobierna incluso el cambio inesperado.", anclajeCorporal: "Aflojar las manos que quizás estén cerradas en puño. Respirar hondo y, al exhalar, decir: 'Suelto mi plan, recibo el Tuyo'.", medicinaPersistente: "Cada cambio de planes sigue sacudiendo con la misma fuerza. Esto delata que la paz depende del control, y no de Dios. Practicar hoy decir 'está bien' ante un imprevisto pequeño, sin resistirlo, entrena la confianza.", pasajePersistente: "Proverbios 19:21" },

                    textoCompleto: `Si Jehová no edificare la casa, en vano trabajan los que la edifican; si Jehová no guardare la ciudad, en vano vela la guardia. Por demás es que os levantéis de madrugada, y os llevéis tarde a descansar, y que comáis pan de dolores; pues que a su amado dará Dios el sueño. He aquí, herencia de Jehová son los hijos; cosa de estima el fruto del vientre. Como saetas en mano del valiente, así son los hijos habidos en la juventud. Bienaventurado el hombre que llenó su aljaba de ellos; no será avergonzado cuando hablare con los enemigos en la puerta.`,
                    pregunta1: `El salmista califica de "vano" el madrugar temprano, acostarse tarde y comer pan de dolores por esfuerzo propio. ¿A quién le concede Dios el verdadero descanso según el versículo 2?`,
                    pregunta2: `Jesús nos recuerda que no podemos añadir un codo a nuestra estatura por más que nos afanemos (Mateo 6:27). ¿Qué proyecto o responsabilidad estás intentando sostener mediante la vigilia ansiosa en lugar de confiar en la edificación del Señor?`,
                    preguntaDecision: `¿A qué hábito de sobretrabajo o control vas a renunciar hoy para aceptar el reposo que Dios da a sus amados?` },
                { dia: 3, pasaje: `Juan 15:1-5`, foco: `Permanecer pegado a la Vid para dar fruto sin esfuerzo carnal.`,
                    textoCompleto: `Yo soy la vid verdadera, y mi Padre es el labrador. Todo pámpano que en mí no lleva fruto, lo quitará; y todo aquel que lleva fruto, lo limpiará, para que lleve más fruto. Ya vosotros estáis limpios por la palabra que os he hablado. Permaneced en mí, y yo en vosotros. Como el pámpano no puede llevar fruto por sí mismo, si no permanece en la vid, así tampoco vosotros, si no permanecéis en mí. Yo soy la vid, vosotros los pámpanos; el que permanece en mí, y yo en él, este lleva mucho fruto; porque separados de mí nada podéis hacer.`,
                    pregunta1: `Jesús declara categóricamente: "Separados de mí nada podéis hacer". ¿Cuál es la única condición que se le pide a la rama para que pueda llevar mucho fruto?`,
                    pregunta2: `El trabajo de la rama no es fabricar fruto a fuerza de tensión, sino recibir la savia de la vid. ¿Estás gastando tus energías tratando de producir virtudes por tu propio impulso o buscando permanecer íntimamente unido a Cristo?`,
                    preguntaDecision: `¿Qué esfuerzo desconectado de la oración vas a detener hoy para volver a depender totalmente de la savia de Jesús?` },
                { dia: 4, pasaje: `Éxodo 20:8-11`, foco: `El Shabat como un límite sagrado de protección para tu vida.`,
                    textoCompleto: `Acuérdate del día de reposo para santificarlo. Seis días trabajarás, y harás toda tu obra; mas el séptimo día es reposo para Jehová tu Dios; no hagas en él obra alguna, tú, ni tu hijo, ni tu hija, ni tu siervo, ni tu criada, ni tu bestia, ni tu extranjero que está dentro de tus puertas. Porque en seis días hizo Jehová los cielos y la tierra, el mar, y todas las cosas que en ellos hay, y reposó en el séptimo día; por tanto, Jehová bendijo el día de reposo y lo santificó.`,
                    pregunta1: `Dios ordena guardar el día de reposo no como una carga represiva, sino recordando que Él mismo cesó de su obra creadora al séptimo día. ¿Qué valor asigna el Creador al establecimiento de un límite al trabajo humano?`,
                    pregunta2: `Jesús afirmó que "el día de reposo fue hecho por causa del hombre, y no el hombre por causa del día de reposo" (Marcos 2:27). ¿De qué manera el negarte a parar revela una falta de confianza en que Dios sigue gobernando el mundo sin tu trabajo?`,
                    preguntaDecision: `¿Qué límite claro vas a poner hoy a tu agenda laboral o digital para honrar el descanso que Dios diseñó para tu protección?` },
                { dia: 5, pasaje: `Mateo 6:25-34`, foco: `Someter la ansiedad confiando en el cuidado amoroso de tu Proveedor.`,
                    textoCompleto: `Por tanto os digo: No os afanéis por vuestra vida, qué habéis de comer o qué habéis de beber; ni por vuestro cuerpo, qué habéis de vestir. ¿No es la vida más que el alimento, y el cuerpo más que el vestido? Mirad las aves del cielo, que no siembran, ni siegan, ni recogen en graneros; y vuestro Padre celestial las alimenta. ¿No valéis vosotros mucho más que ellas? ¿Y quién de vosotros podrá, por mucho que se afane, añadir a su estatura un codo? Y por el vestido, ¿por qué os afanáis? Considerad los lirios del campo, cómo crecen: no trabajan ni hilan; pero os digo, que ni aun Salomón con toda su gloria se vistió así como uno de ellos. Y si la hierba del campo que hoy es, y mañana se echa en el horno, Dios la viste así, ¿no hará mucho más por vosotros, hombres de poca fe? No os afanéis, pues, diciendo: ¿Qué comeremos, o qué beberemos, o qué vestiremos? Porque los gentiles buscan todas estas cosas; pero vuestro Padre celestial sabe que tenéis necesidad de todas estas cosas. Mas buscad primeramente el reino de Dios y su justicia, y todas estas cosas os serán añadidas. Así que, no os afanéis por el día de mañana, porque el día de mañana traerá su afán. Basta a cada día su propio mal.`,
                    pregunta1: `Jesús apunta a las aves del cielo y a los lirios del campo para ilustrar la provisión del Padre. ¿Qué pregunta confrontativa nos hace respecto a nuestro valor en comparación con ellos?`,
                    pregunta2: `Buscar "primeramente el reino de Dios y su justicia" reorganiza nuestras prioridades y desarma el afán del mañana. ¿Qué afán del futuro estás cargando hoy como si no tuvieras un Padre celestial que ya conoce tus necesidades?`,
                    preguntaDecision: `¿Qué preocupación concreta sobre el día de mañana vas a entregar hoy en las manos de tu Proveedor?` },
                { dia: 6, pasaje: `Salmo 46`, foco: `'Estad quietos y reconoced que Yo Soy Dios'.`,
                    textoCompleto: `Dios es nuestro amparo y fortaleza, nuestro pronto auxilio en las tribulaciones. Por tanto, no temeremos, aunque la tierra sea removida, y se traspasen los montes al corazón del mar; aunque bramen y se turben sus aguas, y tiemblen los montes a causa de su bravesa. Del río sus corrientes alegran la ciudad de Dios, el santuario de las moradas del Altísimo. Dios está en medio de ella; no será conmovida. Dios la ayudará al clarear la mañana. Bramaron las naciones, titubearon los reinos; dio él su voz, derritióse la tierra. Jehová de los ejércitos está con nosotros; nuestro refugio es el Dios de Jacob. Venid, ved las obras de Jehová, que ha puesto asolamientos en la tierra. Que hace cesar las guerras hasta los fines de la tierra. Que quiebra el arco, corta la lanza, y quema los carros en el fuego. Estad quietos, y conoced que yo soy Dios; seré exaltado entre las naciones; enaltecido seré en la tierra. Jehová de los ejércitos está con nosotros; nuestro refugio es el Dios de Jacob.`,
                    pregunta1: `En medio de montes que se traspasan al mar y naciones que se conmueven, el salmo ordena: "Estad quietos, y conoced que yo soy Dios". ¿En qué se fundamenta la firmeza del pueblo de Dios en el versículo 5?`,
                    pregunta2: `En medio de la tormenta, Jesús durmió en la barca y con una sola palabra calmó el viento y el mar (Marcos 4:39). ¿Qué ruido o caos exterior está impidiendo que escuches la voz de Cristo mandando acallar tu corazón?`,
                    preguntaDecision: `¿Qué espacio de silencio e inmovilidad vas a guardar hoy para reconocer activamente el señorío de Dios?` },
                { dia: 7, pasaje: `Gálatas 6:9-10`, foco: `Caminar con constancia sin permitir que el cansancio dicte tu rumbo.`,
                    textoCompleto: `No nos cansemos, pues, de hacer el bien; porque a su tiempo cosecharemos, si no desmayamos. Así que, según tengamos oportunidad, hagamos bien a todos, y mayormente a los de la familia de la fe.`,
                    pregunta1: `Pablo nos anima diciendo: "No nos cansemos, pues, de hacer el bien; porque a su tiempo cosecharemos, si no desmayamos". ¿Cuál es la condición fijada para ver el fruto de lo sembrado?`,
                    pregunta2: `Jesús no desmayó ni se desvió de su camino a pesar de la incomprensión y la fatiga (Hebreos 12:3). ¿Estás tentado a abandonar una buena obra o un compromiso de amor solo porque no ves resultados inmediatos o estás físicamente exhausto?`,
                    preguntaDecision: `¿Qué acto de bien o servicio perseverante vas a retomar hoy, confiando en que el tiempo de la cosecha le pertenece a Dios?` },
                { dia: 8, pasaje: `Lucas 12:22-31`, foco: `Considerar la belleza de los lirios y tu incalculable valor para Dios.`,
                    textoCompleto: `Dijo luego a sus discípulos: Por tanto os digo: No os afanéis por vuestra vida, qué comeréis; ni por el cuerpo, qué vestiréis. La vida es más que el alimento, y el cuerpo que el vestido. Considerad los cuervos, que ni siembran, ni siegan; que ni tienen despensa, ni granero, y Dios los alimenta. ¿No valéis vosotros mucho más que las aves? ¿Y quién de vosotros podrá con afanarse añadir a su estatura un codo? Pues si no podéis ni aun lo que es menos, ¿por qué os afanáis por lo demás? Considerad los lirios, cómo crecen: no trabajan, ni hilan; mas os digo, que ni aun Salomón con toda su gloria se vistió como uno de ellos. Y si así viste Dios la hierba que hoy está en el campo, y mañana es echada en el horno, ¿cuánto más a vosotros, hombres de poca fe? Vosotros, pues, no os afanéis por lo que habéis de comer, ni por lo que habéis de beber, ni estéis en ansiosa inquietud. Porque todas estas cosas buscan las gentes del mundo; pero vuestro Padre sabe que tenéis necesidad de estas cosas. Mas buscad el reino de Dios, y todas estas cosas os serán añadidas.`,
                    pregunta1: `El pasaje destaca cómo Dios viste a la hierba del campo que hoy es y mañana se echa en el horno. ¿Cómo describe Jesús a los que dudan del cuidado paternal de Dios en el versículo 28?`,
                    pregunta2: `La búsqueda angustiosa de "qué comeréis o qué beberéis" es propia de quien no conoce al Padre. ¿De qué manera recordar tu valor incalculable para Cristo cambia tu forma de enfrentar la escasez o la incertidumbre?`,
                    preguntaDecision: `¿Qué pensamiento de escasez o desprotección vas a confrontar hoy recordando la belleza y el sustento que Dios da a su creación?` },
                { dia: 9, pasaje: `Salmo 90:12`, foco: `Contar nuestros días con sabiduría para desechar lo intrascendental.`,
                    textoCompleto: `Enséñanos de tal modo a contar nuestros días, que traigamos al corazón sabiduría.`,
                    pregunta1: `Moisés le pide a Dios: "Enséñanos de tal modo a contar nuestros días, que traigamos al corazón sabiduría". ¿Por qué la conciencia de la brevedad de la vida terrenal nos conduce a la sabiduría?`,
                    pregunta2: `Jesús vivió cada día con un sentido claro de hora y propósito, sin dejarse arrastrar por las demandas apresuradas de la multitud (Juan 7:6). ¿En qué afanes efímeros estás gastando tu tiempo y energía a costa de lo que realmente tiene valor eterno?`,
                    preguntaDecision: `¿A qué compromiso o distracción intrascendente le vas a decir "no" hoy para enfocar tu tiempo en lo que permanece?` },
                { dia: 10, pasaje: `Marcos 6:30-32`, foco: `'Venid vosotros solos a un lugar desierto... y descansad'.`,
                    textoCompleto: `Entonces los apóstoles se reunieron con Jesús, y le contaron todo lo que habían hecho, y lo que habían enseñado. Él les dijo: Venid vosotros aparte a un lugar desierto, y descansad un poco. Porque eran muchos los que iban y venían, de manera que ni aun tenían tiempo para comer. Y se fueron solos en una barca a un lugar desierto.`,
                    pregunta1: `Cuando los apóstoles regresaron de su misión contando todo lo que habían hecho y enseñado, ¿cuál fue la primera indicación de Jesús ante la multitud que ni los dejaba comer?`,
                    pregunta2: `Jesús priorizó la restauración física y espiritual de sus discípulos por encima de las demandas inmediatas de la multitud. ¿Sientes culpa cuando te retiras a descansar, o reconoces en ese retiro una orden amorosa de tu Señor?`,
                    preguntaDecision: `¿Qué "lugar desierto" o momento de retiro a solas con Jesús vas a programar hoy para renovar tus fuerzas?` },
                { dia: 11, pasaje: `Deuteronomio 5:12-15`, foco: `El descanso como un recordatorio gozoso de que ya no eres esclavo.`,
                    textoCompleto: `Guardarás el día de reposo para santificarlo, como Jehová tu Dios te ha mandado. Seis días trabajarás, y harás toda tu obra; mas el séptimo día es reposo para Jehová tu Dios; ninguna obra harás tú, ni tu hijo, ni tu hija, ni tu siervo, ni tu sierva, ni tu buey, ni tu asno, ni ningún animal tuyo, ni el extranjero que está dentro de tus puertas, para que descanse tu siervo y tu sierva como tú. Acuérdate que fuiste siervo en tierra de Egipto, y que Jehová tu Dios te sacó de allá con mano fuerte y brazo extendido; por lo cual Jehová tu Dios te ha mandado que guardes el día de reposo.`,
                    pregunta1: `En esta repetición de la ley, el mandato del descanso se fundamenta en un hecho histórico: "Acuérdate que fuiste siervo en tierra de Egipto, y que Jehová tu Dios te sacó de allá". ¿Cómo se conecta el reposo con la liberación de la esclavitud?`,
                    pregunta2: `Cristo nos ha libertado de la esclavitud del pecado y de las exigencias del mundo (Gálatas 5:1). ¿Estás viviendo como un esclavo del trabajo y del rendimiento, o como un hijo libre que celebra su redención descansando?`,
                    preguntaDecision: `¿Qué comportamiento de "esclavo de la productividad" vas a interrumpir hoy para celebrar la libertad que Cristo te compró?` },
                { dia: 12, pasaje: `Proverbios 3:5-8`, foco: `Confiar con todo tu ser y renunciar a tu propia prudencia terrenal.`,
                    textoCompleto: `Fíate de Jehová de todo tu corazón, y no te apoyes en tu propia prudencia. Reconócelo en todos tus caminos, y él enderezará tus veredas. No seas sabio en tu propia opinión; teme a Jehová, y apártate del mal; porque será medicina a tu cuerpo, y refrigerio para tus huesos.`,
                    pregunta1: `El pasaje contrapone el "fíate de Jehová de todo tu corazón" con el "no te apoyes en tu propia prudencia". ¿Qué promesa se da en el versículo 6 a quien lo reconoce en todos sus caminos?`,
                    pregunta2: `Jesús rindió su propia voluntad a la del Padre en todo momento (Lucas 22:42). ¿En qué decisión actual estás apoyándote en tus razonamientos analíticos o temores antes que en la guía clara del Señor?`,
                    preguntaDecision: `¿Qué plan o razonamiento humano vas a someter hoy al Señorío de Cristo, pidiéndole que dirija tus veredas?` },
                { dia: 13, pasaje: `Salmo 37:3-7`, foco: `Encomendar pacientemente el camino y guardar silencio ante Él.`,
                    textoCompleto: `Confía en Jehová, y haz el bien; y habitarás en la tierra, y te apacentarás de la verdad. Deléitate asimismo en Jehová, y él te concederá las peticiones de tu corazón. Encomienda a Jehová tu camino, y confía en él; y él hará. Exhibirá tu justicia como la luz, y tu derecho como el mediodía. Guarda silencio ante Jehová, y espera en él. No te alteres con motivo del que prospera en su camino, por el hombre que hace maldad.`,
                    pregunta1: `El salmista enlaza una serie de acciones: confía, haz el bien, deléitate en Jehová, encomienda a Él tu camino, guarda silencio y espera con paciencia. ¿Qué hará Dios según el versículo 6 cuando le encomiendas tu causa?`,
                    pregunta2: `Jesús guardó silencio ante sus acusadores y encomendó la causa al que juzga justamente (1 Pedro 2:23). ¿Estás intentando defenderte o forzar los tiempos por tu cuenta, en vez de aguardar pacientemente la manifestación de Dios?`,
                    preguntaDecision: `¿Qué causa o situación no resuelta vas a encomendar hoy en silencio al Señor, renunciando a la desesperación?` },
                { dia: 14, pasaje: `Efesios 4:22-24`, foco: `Despojarse de los viejos hábitos de prisa y renovar tu mente.`,
                    textoCompleto: `En cuanto a la pasada manera de vivir, despojaos del viejo hombre, que está viciado conforme a los deseos engañosos, y renovaos en el espíritu de vuestra mente, y vestíos del nuevo hombre, creado según Dios en la justicia y santidad de la verdad.`,
                    pregunta1: `Pablo exhorta a despojarse del "viejo hombre" contaminado por deseos engañosos y a renovarse en el espíritu de la mente. ¿Qué caracteriza al "nuevo hombre" en el versículo 24?`,
                    pregunta2: `En Cristo somos una nueva creación y las cosas viejas pasaron (2 Corintios 5:17). ¿Qué viejas rutinas de afán, impaciencia o prisa sigues arrastrando como si pertenecieran a tu verdadera identidad en Cristo?`,
                    preguntaDecision: `¿De qué hábito o reacción propia del "viejo hombre" te vas a despojar hoy para vestir la paz y justicia de Cristo?` },
            ],
            stable: [
                { dia: 1, pasaje: `Salmo 1`, foco: `El creyente plantado junto a corrientes que da fruto a su tiempo.`,
                    textoCompleto: `Bienaventurado el varón que no anduvo en consejo de malos, ni estuvo en camino de pecadores, ni en silla de escarnecedores se ha sentado; sino que en la ley de Jehová está su delicia, y en su ley medita de día y de noche. Será como árbol plantado junto a corrientes de aguas, que da su fruto en su tiempo, y su hoja no cae; y todo lo que hace, prosperará. No así los malos, que son como el tamo que arrebata el viento. Por tanto, no se levantarán los malos en el juicio, ni los pecadores en la congregación de los justos. Porque Jehová conoce el camino de los justos; mas la senda de los malos perecerá.`,
                    pregunta1: `En el Salmo 1, el justo es comparado con un árbol plantado junto a corrientes de aguas. ¿De dónde procede su capacidad para dar fruto a su tiempo y mantener su hoja verde sin marchitarse?`,
                    pregunta2: `Jesús se presentó como la fuente de agua viva que sacia para siempre (Juan 7:38). ¿De qué manera buscas a veces dar fruto apresurado por tu propia fuerza, en lugar de permitir que tus raíces se profundicen pacientemente en Cristo?`,
                    preguntaDecision: `¿Qué hábito de meditación o contemplación vas a cultivar hoy para plantar tus raíces más cerca del agua viva?` },
                { dia: 2, pasaje: `Romanos 12:1-2`, foco: `Tu rutina diaria como un altar consagrado y razonable a Dios.`,
                    textoCompleto: `Así que, hermanos, os ruego por las misericordias de Dios, que presentéis vuestros cuerpos en sacrificio vivo, santo, agradable a Dios, que es vuestro culto racional. No os conforméis a este siglo, sino transformaos por medio de la renovación de vuestro entendimiento, para que comprobéis cuál sea la buena voluntad de Dios, agradable y perfecta.`,
                    pregunta1: `Pablo nos ruega presentar nuestros cuerpos como "sacrificio vivo, santo, agradable a Dios". ¿Cómo describe este acto en relación con el culto o servicio que le ofrecemos al Señor?`,
                    pregunta2: `Renovar la mente impide que el molde del mundo nos configure. ¿Qué idea terrenal sobre el éxito o la productividad vas a dejar de copiar para abrazar la buena, agradable y perfecta voluntad de Dios?`,
                    preguntaDecision: `¿Qué tarea u ocupación ordinaria de tu jornada vas a entregar hoy en el altar como un acto consciente de culto a Cristo?` },
                { dia: 3, pasaje: `Efesios 6:10-18`, foco: `Firmeza y armadura espiritual para resistir la fatiga de la vida.`,
                    textoCompleto: `Por lo demás, hermanos míos, fortaleceos en el Señor, y en el poder de su fuerza. Vestíos de toda la armadura de Dios, para que podáis estar firmes contra las asechanzas del diablo. Porque no tenemos lucha contra sangre y carne, sino contra principados, contra potestades, contra los gobernadores de las tinieblas de este siglo, contra huestes espirituales de maldad en las regiones celestes. Por tanto, tomad toda la armadura de Dios, para que podáis resistir en el día malo, y habiendo acabado todo, estar firmes. Estad, pues, firmes, ceñidos vuestros lomos con la verdad, y vestidos con la coraza de justicia, y calzados los pies con el apresto del evangelio de la paz. Sobre todo, tomad el escudo de la fe, con que podáis apagar todos los dardos de fuego del maligno. Y tomad el yelmo de la salvación, y la espada del Espíritu, que es la palabra de Dios; orando en todo tiempo con toda oración y súplica en el Espíritu, y velando en ello con toda perseverancia y súplica por todos los santos.`,
                    pregunta1: `El pasaje nos manda a "fortalecernos en el Señor y en el poder de su fuerza". ¿Para qué propósito específico se nos da la armadura de Dios según los versículos 11 y 13?`,
                    pregunta2: `La armadura no es para atacar desesperadamente, sino para "estar firmes" en la victoria que Cristo ya conquistó. ¿Estás peleando tus batallas con el desgaste de tu carne o permaneciendo firme en la verdad y la paz de Jesús?`,
                    preguntaDecision: `¿De qué pieza de la armadura (la verdad, la fe, la paz, la salvación) te vas a vestir conscientemente hoy para mantenerte firme?` },
                { dia: 4, pasaje: `Colosenses 3:1-4`, foco: `Fijar tus pensamientos y afectos en las cosas del Reino celestial.`,
                    textoCompleto: `Si, pues, habéis resucitado con Cristo, buscad las cosas de arriba, donde está Cristo sentado a la diestra de Dios. Poned la mira en las cosas de arriba, no en las de la tierra. Porque habéis muerto, y vuestra vida está escondida con Cristo en Dios. Cuando Cristo, vuestra vida, se manifieste, entonces vosotros también seréis manifestados con él en gloria.`,
                    pregunta1: `Puesto que resucitamos con Cristo, ¿dónde se nos insta a poner la mirada y los afectos, y qué ocurrió con nuestra vida según el versículo 3?`,
                    pregunta2: `Tu verdadera vida está "escondida con Cristo en Dios". ¿De qué manera el aferrarte a las validaciones o temores terrenales eclipsa la libertad de tu identidad en Jesús?`,
                    preguntaDecision: `¿Qué pensamiento o ambición puramente terrenal vas a soltar hoy para fijar tus afectos en la presencia de Cristo?` },
                { dia: 5, pasaje: `Salmo 119:9-16`, foco: `La meditación en la Palabra como un tesoro de paz interna.`,
                    textoCompleto: `¿Con qué limpiará el joven su camino? Con guardar tu palabra. Con todo mi corazón te he buscado; no me dejes desviarme de tus mandamientos. En mi corazón he guardado tus dichos, para no pecar contra ti. Bendito tú, oh Jehová; enséñame tus estatutos. Con mis labios he contado todos los juicios de tu boca. Me he gozado en el camino de tus testimonios más que de toda riqueza. En tus mandamientos meditaré; consideraré tus caminos. Me regocijaré en tus estatutos; no me olvidaré de tus palabras.`,
                    pregunta1: `El salmista pregunta con qué guardará el joven su camino, y responde que guardando la Palabra. ¿Dónde ha guardado él los dichos de Dios y para qué propósito en el versículo 11?`,
                    pregunta2: `Jesús enseñó que su Palabra nos purifica y santifica en la verdad (Juan 17:17). ¿Cómo cambia tu perspectiva del día al meditar en la verdad de Cristo en lugar de alimentar tu mente con el ruido del entorno?`,
                    preguntaDecision: `¿Qué verdad de la Escritura vas a guardar en tu corazón hoy para acudir a ella cuando aparezca la turbación?` },
                { dia: 6, pasaje: `Santiago 1:2-8`, foco: `La madurez de tu carácter forjada pacientemente en las pruebas.`,
